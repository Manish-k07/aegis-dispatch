services:
  # 1. PostGIS Database Engine
  postgres:
    image: postgis/postgis:16-3.4
    container_name: aegis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegis_dispatch}
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_demo}
    ports:
      - "${DB_EXPOSE_PORT:-5432}:5432"
    volumes:
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/src/main/resources/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
      - aegis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegis} -d ${POSTGRES_DB:-aegis_dispatch}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aegis-net

  # 2. Mission-Critical Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegis-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aegis_dispatch}
      DB_USER: ${POSTGRES_USER:-aegis}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-aegis_demo}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:8080,http://localhost,http://127.0.0.1}
    ports:
      - "8080:8080"
    volumes:
      - aegis_cad_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aegis-net

  # 3. Production Nginx + React 18 Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aegis-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
      - "80:80"
    networks:
      - aegis-net

volumes:
  aegis_pgdata:
    driver: local
  aegis_cad_data:
    driver: local

networks:
  aegis-net:
    driver: bridge
