spring:
  application:
    name: aegis-dispatch
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/aegis_dispatch;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: true
server:
  port: ${PORT:8080}
  error:
    include-message: always
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  stale-seconds: ${STALE_SECONDS:60}
  dispatch:
    eta-weight: ${ETA_WEIGHT:0.30}
    capability-weight: ${CAPABILITY_WEIGHT:0.30}
    availability-weight: ${AVAILABILITY_WEIGHT:0.15}
    distance-weight: ${DISTANCE_WEIGHT:0.15}
    traffic-weight: ${TRAFFIC_WEIGHT:0.10}
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aegis_dispatch}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:aegis}
    password: ${DB_PASSWORD:aegis_demo}

